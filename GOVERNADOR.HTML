<!DOCTYPE html
<html lang="pt-br
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="urna">

        <header>
            <h1>JUSTIÇA ELEITORAL</h1>
            <h2>URNA ELETRÔNICA</h2>
        </header>

        <main class="tela">

            <h3>SEU VOTO PARA</h3>
            <h2>GOVERNADOR</h2>

            <div class="numeros">
                <input type="text" id="numero1" maxlength="1">
                <input type="text" id="numero2" maxlength="1">
            </div>

            <div class="candidato">
                <p id="nome">Nome:</p>
                <p id="partido">Partido:</p>
                <p id="mensagem"></p>
            </div>

        </main>

        <section class="teclado">

            <button onclick="digitar(1)">1</button>
            <button onclick="digitar(2)">2</button>
            <button onclick="digitar(3)">3</button>

            <button onclick="digitar(4)">4</button>
            <button onclick="digitar(5)">5</button>
            <button onclick="digitar(6)">6</button>

            <button onclick="digitar(7)">7</button>
            <button onclick="digitar(8)">8</button>
            <button onclick="digitar(9)">9</button>

            <button class="zero" onclick="digitar(0)">0</button>

            <button class="branco" onclick="branco()">BRANCO</button>
            <button class="corrige" onclick="corrigir()">CORRIGE</button>
            <button class="confirma" onclick="confirmar()">CONFIRMA</button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
